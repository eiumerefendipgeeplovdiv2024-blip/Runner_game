<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <title>Cyberpunk Ninja Runner</title>
    <style>
        body {
            margin: 0;
            background: #0f0a19;
            color: #00f0ff;
            font-family: 'Consolas', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        canvas {
            border: 2px solid #ff1493;
            box-shadow: 0 0 20px #ff1493;
        }
    </style>
</head>
<body>
    <h1>CYBERPUNK NINJA RUNNER</h1>
    <canvas id="game" width="800" height="400"></canvas>
    <p>Натисни <b>SPACE</b> за скок</p>

    <script>
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');

        let score = 0;
        let gameOver = false;
        let gameSpeed = 6;
        let spawnTimer = 0;
        let minSpawnInterval = 90; // Гарантира дистанция между препятствията

        const ninja = {
            x: 100, y: 270, w: 30, h: 50,
            vy: 0, gravity: 0.8, isJumping: false,
            trail: []
        };

        let obstacles = [];

        function jump() {
            if (!ninja.isJumping && !gameOver) {
                ninja.vy = -14;
                ninja.isJumping = true;
            } else if (gameOver) {
                resetGame();
            }
        }

        window.addEventListener('keydown', e => { 
            if (e.code === 'Space') {
                e.preventDefault();
                jump(); 
            }
        });

        function resetGame() {
            score = 0;
            gameSpeed = 6;
            spawnTimer = 0;
            obstacles = [];
            ninja.y = 270;
            ninja.vy = 0;
            ninja.isJumping = false;
            ninja.trail = [];
            gameOver = false;
            update();
        }

        function update() {
            if (gameOver) return;

            // Ефект за следа (Motion Blur)
            ninja.trail.push({x: ninja.x, y: ninja.y});
            if (ninja.trail.length > 6) ninja.trail.shift();

            // Физика на играча
            ninja.vy += ninja.gravity;
            ninja.y += ninja.vy;
            if (ninja.y >= 270) {
                ninja.y = 270;
                ninja.vy = 0;
                ninja.isJumping = false;
            }

            // Контролиран спаун на препятствия (с гаранция за разстояние)
            spawnTimer++;
            if (spawnTimer > minSpawnInterval) {
                if (Math.random() < 0.6) {
                    obstacles.push({
                        x: 800,
                        w: Math.floor(Math.random() * 15) + 20,
                        h: Math.floor(Math.random() * 25) + 30
                    });
                    spawnTimer = 0;
                    minSpawnInterval = Math.floor(Math.random() * 40) + 70; // Разстояние между 70 и 110 кадъра
                }
            }

            // Движение и колизии
            for (let i = obstacles.length - 1; i >= 0; i--) {
                obstacles[i].x -= gameSpeed;

                // Точен Hitbox (с лек толеранс от 4px за по-честна игра)
                const pad = 4;
                if (
                    ninja.x + pad < obstacles[i].x + obstacles[i].w &&
                    ninja.x + ninja.w - pad > obstacles[i].x &&
                    ninja.y + pad < 320 &&
                    ninja.y + ninja.h - pad > 320 - obstacles[i].h
                ) {
                    gameOver = true;
                }

                if (obstacles[i].x < -50) obstacles.splice(i, 1);
            }

            score++;
            if (score % 600 === 0 && gameSpeed < 12) {
                gameSpeed += 0.5; // Постепенно увеличаване на скоростта
            }

            draw();
            requestAnimationFrame(update);
        }

        function draw() {
            // Фон
            ctx.fillStyle = '#0f0a19';
            ctx.fillRect(0, 0, 800, 400);

            // Покрив
            ctx.fillStyle = '#281432';
            ctx.fillRect(0, 320, 800, 80);
            ctx.strokeStyle = '#ff1493';
            ctx.lineWidth = 4;
            ctx.beginPath(); ctx.moveTo(0, 320); ctx.lineTo(800, 320); ctx.stroke();

            // Следа зад героя
            ninja.trail.forEach((t, i) => {
                ctx.fillStyle = `rgba(0, 240, 255, ${0.08 * (i + 1)})`;
                ctx.fillRect(t.x, t.y, ninja.w, ninja.h);
            });

            // Нинджа
            ctx.fillStyle = '#00f0ff';
            ctx.fillRect(ninja.x, ninja.y, ninja.w, ninja.h);

            // Препятствия
            ctx.fillStyle = '#ff1493';
            obstacles.forEach(o => ctx.fillRect(o.x, 320 - o.h, o.w, o.h));

            // Точки
            ctx.fillStyle = '#00f0ff';
            ctx.font = '20px Consolas';
            ctx.fillText(`SCORE: ${score}`, 630, 40);

            if (gameOver) {
                ctx.fillStyle = '#ff1493';
                ctx.font = '28px Consolas';
                ctx.fillText('GAME OVER - Press SPACE', 220, 180);
            }
        }

        update();
    </script>
</body>
</html>
