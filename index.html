<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <title>Cyberpunk Ninja Runner</title>
    <style>
        body {
            margin: 0;
            background: #0f0a19;
            color: #00f0ff;
            font-family: 'Consolas', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        canvas {
            border: 2px solid #ff1493;
            box-shadow: 0 0 20px #ff1493;
        }
    </style>
</head>
<body>
    <h1>CYBERPUNK NINJA RUNNER</h1>
    <canvas id="game" width="800" height="400"></canvas>
    <p>Натисни <b>SPACE</b> за скок</p>

    <script>
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');

        let score = 0;
        let gameOver = false;
        let gameSpeed = 6;

        const ninja = {
            x: 100, y: 270, w: 30, h: 50,
            vy: 0, gravity: 0.8, isJumping: false,
            trail: []
        };

        const obstacles = [];

        function jump() {
            if (!ninja.isJumping) {
                ninja.vy = -14;
                ninja.isJumping = true;
            } else if (gameOver) {
                resetGame();
            }
        }

        window.addEventListener('keydown', e => { if(e.code === 'Space') jump(); });

        function resetGame() {
            score = 0;
            gameSpeed = 6;
            obstacles.length = 0;
            ninja.y = 270;
            ninja.vy = 0;
            gameOver = false;
            update();
        }

        function update() {
            if (gameOver) return;

            ninja.trail.push({x: ninja.x, y: ninja.y});
            if (ninja.trail.length > 6) ninja.trail.shift();

            ninja.vy += ninja.gravity;
            ninja.y += ninja.vy;
            if (ninja.y >= 270) {
                ninja.y = 270;
                ninja.vy = 0;
                ninja.isJumping = false;
            }

            if (Math.random() < 0.02) {
                obstacles.push({x: 800, w: 20 + Math.random()*20, h: 30 + Math.random()*30});
            }

            for (let i = obstacles.length - 1; i >= 0; i--) {
                obstacles[i].x -= gameSpeed;
                
                if (ninja.x < obstacles[i].x + obstacles[i].w &&
                    ninja.x + ninja.w > obstacles[i].x &&
                    ninja.y < 320 &&
                    ninja.y + ninja.h > 320 - obstacles[i].h) {
                    gameOver = true;
                }

                if (obstacles[i].x < -50) obstacles.splice(i, 1);
            }

            score++;
            draw();
            requestAnimationFrame(update);
        }

        function draw() {
            ctx.fillStyle = '#0f0a19';
            ctx.fillRect(0, 0, 800, 400);

            ctx.fillStyle = '#281432';
            ctx.fillRect(0, 320, 800, 80);
            ctx.strokeStyle = '#ff1493';
            ctx.lineWidth = 4;
            ctx.beginPath(); ctx.moveTo(0, 320); ctx.lineTo(800, 320); ctx.stroke();

            ninja.trail.forEach((t, i) => {
                ctx.fillStyle = `rgba(0, 240, 255, ${0.1 * i})`;
                ctx.fillRect(t.x, t.y, ninja.w, ninja.h);
            });

            ctx.fillStyle = '#00f0ff';
            ctx.fillRect(ninja.x, ninja.y, ninja.w, ninja.h);

            ctx.fillStyle = '#ff1493';
            obstacles.forEach(o => ctx.fillRect(o.x, 320 - o.h, o.w, o.h));

            ctx.fillStyle = '#00f0ff';
            ctx.font = '20px Consolas';
            ctx.fillText(`SCORE: ${score}`, 650, 40);

            if (gameOver) {
                ctx.fillStyle = '#ff1493';
                ctx.font = '30px Consolas';
                ctx.fillText('GAME OVER - Press SPACE', 200, 200);
            }
        }

        update();
    </script>
</body>
</html>
